<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* dhoa-tokens:start (generated by tools/sync_component_tokens.py; do not edit) */
      :root {
        --page-background: #0f1419;
        --card-background: #182029;
        --raised-background: #212b36;
        --text-primary: #f2f5f8;
        --text-muted: #a3b0bd;
        --border: #2f3b48;
        --border-strong: #7a8a9b;
        --selected: #0072b2;
        --focus: #ffffff;
        --priority-high: #d55e00;
        --priority-medium: #f0e442;
        --priority-low: #009e73;
        --priority-unclassified: #9aa7b4;
        --accent-text: #56b4e9;
      }
      /* dhoa-tokens:end */
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        color: var(--text-primary);
        background: var(--page-background);
        font: 14px/1.6 "Noto Sans Bengali", "Nirmala UI", system-ui, sans-serif;
      }
      #top-scroll {
        height: 16px;
        overflow-x: auto;
        overflow-y: hidden;
        margin: 0 0 6px;
        border-radius: 8px;
        scrollbar-color: var(--border-strong) var(--card-background);
        scrollbar-width: thin;
      }
      #top-scroll-inner { height: 1px; }
      #table-scroll {
        height: 710px;
        overflow: auto;
        color: var(--text-primary);
        background: var(--page-background);
        border: 1px solid var(--border);
        border-radius: 9px;
        scrollbar-color: var(--border-strong) var(--card-background);
        scrollbar-width: thin;
      }
      #table-scroll::-webkit-scrollbar, #top-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
      #table-scroll::-webkit-scrollbar-track, #top-scroll::-webkit-scrollbar-track { background: var(--card-background); }
      #table-scroll::-webkit-scrollbar-thumb, #top-scroll::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border: 2px solid var(--card-background);
        border-radius: 10px;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        min-width: 1380px;
        width: max-content;
        color: var(--text-primary);
        background: var(--page-background);
      }
      th, td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        vertical-align: middle;
      }
      th {
        position: sticky;
        top: 0;
        z-index: 2;
        color: var(--text-primary);
        background: var(--card-background);
        text-align: left;
        font-weight: 700;
      }
      th:first-child, td:first-child {
        position: sticky;
        left: 0;
        min-width: 150px;
        z-index: 3;
        background: var(--page-background);
      }
      th:first-child { z-index: 4; background: var(--card-background); }
      td:nth-child(2) {
        min-width: 210px;
        max-width: 300px;
        white-space: normal;
        color: var(--selected);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.45;
      }
      td:nth-child(3) { min-width: 125px; font-weight: 700; }
      td:nth-child(n+4) { min-width: 150px; text-align: center; }
      tr.candidate:nth-child(even) { background: var(--page-background); }
      tr.candidate:nth-child(even) td:first-child { background: var(--page-background); }
      tr.candidate { cursor: pointer; transition: background-color 120ms ease; touch-action: manipulation; }
      tr.candidate:hover, tr.candidate:nth-child(even):hover { background: var(--card-background); }
      tr.candidate:hover td:first-child, tr.candidate:nth-child(even):hover td:first-child { background: var(--card-background); }
      tr.candidate.selected, tr.candidate:nth-child(even).selected {
        background: var(--selected);
        box-shadow: inset 4px 0 var(--selected);
        font-weight: 700;
      }
      tr.candidate.selected td { color: var(--text-primary); }
      tr.candidate.selected td:first-child, tr.candidate:nth-child(even).selected td:first-child { background: var(--selected); }
      .select-kiln {
        min-height: 44px;
        padding: 7px 10px;
        border: 1px solid var(--selected);
        border-radius: 7px;
        color: var(--text-primary);
        background: var(--page-background);
        font: inherit;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }
      .select-kiln:hover { background: var(--card-background); }
      .select-kiln[aria-pressed="true"] { color: var(--text-primary); background: var(--selected); }
      .select-kiln:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      #table-scroll:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      tr.candidate:focus-visible { outline: 3px solid var(--selected); outline-offset: -3px; }
      body.mobile-layout #top-scroll { display: none; }
      body.mobile-layout #table-scroll {
        height: min(48vh, 420px);
        min-height: 280px;
        overflow-x: hidden;
      }
      body.mobile-layout table { width: 100%; min-width: 0; table-layout: fixed; }
      body.mobile-layout thead { display: none; }
      body.mobile-layout tbody { display: block; width: 100%; }
      body.mobile-layout tr.candidate {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px 8px;
        width: 100%;
        padding: 10px;
        border-bottom: 1px solid var(--border);
      }
      body.mobile-layout td, body.mobile-layout th {
        min-width: 0 !important;
        max-width: none;
        padding: 5px;
        white-space: normal;
      }
      body.mobile-layout td:first-child {
        position: static;
        grid-row: 1;
        grid-column: 1;
        background: transparent !important;
      }
      body.mobile-layout td:nth-child(2) {
        grid-row: 2;
        grid-column: 1 / -1;
        color: var(--text-primary);
        font-size: 13px;
      }
      body.mobile-layout td:nth-child(3) {
        grid-row: 1;
        grid-column: 2;
        text-align: right;
      }
      body.mobile-layout td:nth-child(n+4) {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 52px;
        padding: 7px !important;
        border: 1px solid var(--border);
        border-radius: 6px;
        text-align: left;
        font-size: 13px;
      }
      body.mobile-layout td:nth-child(n+4)::before {
        content: attr(data-label);
        color: var(--text-primary);
        font-size: 11px;
        line-height: 1.25;
      }
      body.mobile-layout .select-kiln { min-height: 44px; }
      @media (prefers-reduced-motion: reduce) {
        tr.candidate { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="top-scroll" aria-hidden="true">
      <div id="top-scroll-inner"></div>
    </div>
    <div id="table-scroll" role="region" tabindex="0">
      <table id="list-table">
        <thead><tr id="headers"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <script>
      const topBar = document.getElementById("top-scroll");
      const topInner = document.getElementById("top-scroll-inner");
      const tableBox = document.getElementById("table-scroll");
      const table = document.querySelector("table");

      function send(type, data = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...data },
          "*"
        );
      }

      let latestArgs = {};

      function getPageViewport() {
        try {
          return {
            width: document.documentElement.clientWidth || window.innerWidth,
            height: window.parent.innerHeight,
          };
        } catch (error) {
          return { width: window.innerWidth, height: window.innerHeight };
        }
      }

      function setFrameHeight(args = latestArgs) {
        const viewport = getPageViewport();
        const isMobile = viewport.width <= 768;
        document.body.classList.toggle("mobile-layout", isMobile);
        const frameHeight = isMobile
          ? Math.min(420, Math.max(280, viewport.height * 0.48))
          : Math.min(860, Math.max(420, viewport.height - 250));  // follows the window, like the map
        tableBox.style.height = `${Math.max(240, frameHeight - 42)}px`;
        send("streamlit:setFrameHeight", { height: frameHeight });
      }

      // Table layout dominates the cost (about 0.55 s for 2,135 rows in Chromium, much more on a phone), so
      // only the first rows are laid out; more are appended when the user scrolls or tabs near the end.
      const FIRST_CHUNK = 120;
      const NEXT_CHUNK = 240;
      const rowsBody = document.getElementById("rows");
      let current = { signature: "", columns: [], rows: [], ids: [] };
      let rowById = new Map();
      let renderedCount = 0;

      function selectKiln(kilnId, isSelected) {
        send("streamlit:setComponentValue", {
          value: { kiln_id: isSelected ? null : kilnId, selection_token: `${Date.now()}-${Math.random()}` },
          dataType: "json",
        });
      }

      function applyRowSelection(tr, isSelected, args) {
        tr.classList.toggle("selected", isSelected);
        const button = tr.querySelector("button.select-kiln");
        if (!button) return;
        button.textContent = isSelected
          ? (args.selected_label || "\u2713 \u09a8\u09bf\u09b0\u09cd\u09ac\u09be\u099a\u09bf\u09a4")
          : (args.select_label || "\u09ad\u09be\u099f\u09be\u099f\u09bf \u09a6\u09c7\u0996\u09c1\u09a8");
        button.setAttribute("aria-pressed", String(isSelected));
        const fmt = args.aria_select_fmt || "{0}: {1}";
        const values = current.rows[Number(tr.dataset.index)] || [];
        button.setAttribute("aria-label", fmt.replace("{0}", button.textContent).replace("{1}", String(values[1] || "")));
      }

      function buildRow(index, args, selectedKey) {
        const values = current.rows[index];
        const kilnId = current.ids[index] || "";
        const tr = document.createElement("tr");
        tr.className = "candidate";
        tr.dataset.index = String(index);
        tr.dataset.kilnId = kilnId;
        tr.setAttribute("aria-rowindex", String(index + 2));
        for (let column = 0; column < values.length; column += 1) {
          const td = document.createElement("td");
          td.setAttribute("data-label", current.columns[column] || "");
          if (column === 0) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "select-kiln";
            button.addEventListener("click", (event) => {
              event.stopPropagation();
              selectKiln(kilnId, tr.classList.contains("selected"));
            });
            td.appendChild(button);
          } else {
            td.textContent = values[column];
          }
          tr.appendChild(td);
        }
        tr.addEventListener("click", () => selectKiln(kilnId, tr.classList.contains("selected")));
        applyRowSelection(tr, selectedKey !== "" && kilnId === selectedKey, args);
        rowById.set(kilnId, tr);
        return tr;
      }

      function appendRows(limit, args) {
        const end = Math.min(current.rows.length, limit);
        if (renderedCount >= end) return;
        const selectedKey = args.selected_id == null ? "" : String(args.selected_id);
        const fragment = document.createDocumentFragment();
        for (let index = renderedCount; index < end; index += 1) fragment.appendChild(buildRow(index, args, selectedKey));
        rowsBody.appendChild(fragment);
        renderedCount = end;
        topInner.style.width = `${table.scrollWidth}px`;
      }

      function render(args) {
        latestArgs = args;
        if (args.lang) document.documentElement.lang = args.lang;
        const label = args.aria_label || "";
        tableBox.setAttribute("aria-label", label);
        table.setAttribute("aria-label", label);
        const selectedKey = args.selected_id == null ? "" : String(args.selected_id);
        const signature = JSON.stringify([
          args.columns || [], args.rows || [], args.kiln_ids || [],
          args.select_label || "", args.selected_label || "", args.aria_select_fmt || "",
        ]);
        if (signature !== current.signature) {
          // New rows or labels: rebuild, starting from the top of the new list.
          current = {
            signature,
            columns: args.columns || [],
            rows: args.rows || [],
            ids: (args.kiln_ids || []).map(String),
          };
          const headers = document.getElementById("headers");
          headers.replaceChildren();
          headers.setAttribute("aria-rowindex", "1");
          rowsBody.replaceChildren();
          rowById = new Map();
          renderedCount = 0;
          for (const heading of current.columns) {
            const th = document.createElement("th");
            th.textContent = heading;
            th.scope = "col";
            headers.appendChild(th);
          }
          table.setAttribute("aria-rowcount", String(current.rows.length + 1));
          appendRows(FIRST_CHUNK, args);
          tableBox.scrollTop = 0;
          topBar.scrollLeft = tableBox.scrollLeft;
        } else {
          // Same rows: only the selection can differ, so flip at most two rows in place.
          for (const tr of Array.from(rowsBody.querySelectorAll("tr.selected"))) {
            if (tr.dataset.kilnId !== selectedKey) applyRowSelection(tr, false, args);
          }
          // A selected row that is not rendered yet is marked when it is built (see buildRow).
          const tr = selectedKey ? rowById.get(selectedKey) : null;
          if (tr && !tr.classList.contains("selected")) applyRowSelection(tr, true, args);
        }
        setFrameHeight(args);
      }

      let scrollQueued = false;
      tableBox.addEventListener("scroll", () => {
        if (scrollQueued || renderedCount >= current.rows.length) return;
        scrollQueued = true;
        requestAnimationFrame(() => {
          scrollQueued = false;
          if (tableBox.scrollTop + tableBox.clientHeight > tableBox.scrollHeight - 600) {
            appendRows(renderedCount + NEXT_CHUNK, latestArgs);
          }
        });
      });
      // Keyboard users tabbing towards the end of the rendered rows get the next block.
      rowsBody.addEventListener("focusin", (event) => {
        const tr = event.target.closest ? event.target.closest("tr") : null;
        if (tr && renderedCount < current.rows.length && Number(tr.dataset.index) >= renderedCount - 10) {
          appendRows(renderedCount + NEXT_CHUNK, latestArgs);
        }
      });

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          render(event.data.args || {});
        }
      });
      topBar.addEventListener("scroll", () => {
        tableBox.scrollLeft = topBar.scrollLeft;
      });
      window.addEventListener("resize", () => setFrameHeight());

      send("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
