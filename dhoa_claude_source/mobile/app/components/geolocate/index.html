<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* dhoa-tokens:start (generated by tools/sync_component_tokens.py; do not edit) */
      :root {
        --page-background: #0f1419;
        --card-background: #182029;
        --raised-background: #212b36;
        --text-primary: #f2f5f8;
        --text-muted: #a3b0bd;
        --border: #2f3b48;
        --border-strong: #7a8a9b;
        --selected: #0072b2;
        --focus: #ffffff;
        --priority-high: #d55e00;
        --priority-medium: #f0e442;
        --priority-low: #009e73;
        --priority-unclassified: #9aa7b4;
        --accent-text: #56b4e9;
      }
      /* dhoa-tokens:end */
      html, body { margin: 0; background: transparent; }
      button {
        width: 100%; min-height: 44px; padding: 8px 16px; cursor: pointer;
        color: var(--text-primary); background: var(--raised-background); border: 1px solid var(--border-strong);
        border-radius: 10px; font: 600 15px/1.6 "Noto Sans Bengali", "Nirmala UI", system-ui, sans-serif;
      }
      button:hover { background: var(--card-background); border-color: var(--accent-text); }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      button[disabled] { opacity: .6; cursor: progress; }
    </style>
  </head>
  <body>
    <button id="go" type="button"></button>
    <script>
      // Bidirectional Streamlit component: no page reload, no query string.
      // Sends {lat, lon, accuracy, token} on success, or {error, token} where
      // error is one of: unsupported | denied | unavailable | timeout | insecure.
      const button = document.getElementById("go");
      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
      }
      function reply(payload) {
        payload.token = `${Date.now()}-${Math.random()}`;
        send("streamlit:setComponentValue", { value: payload, dataType: "json" });
      }
      function locate(labels) {
        if (!window.isSecureContext) { reply({ error: "insecure" }); return; }
        if (!navigator.geolocation) { reply({ error: "unsupported" }); return; }
        button.disabled = true;
        button.textContent = labels.busy;
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            button.disabled = false; button.textContent = labels.idle;
            reply({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy });
          },
          (err) => {
            button.disabled = false; button.textContent = labels.idle;
            const map = { 1: "denied", 2: "unavailable", 3: "timeout" };
            reply({ error: map[err.code] || "unavailable" });
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      }
      let bound = false;
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        const labels = { idle: args.label || "", busy: args.busy_label || "" };
        button.textContent = labels.idle;
        button.onclick = () => locate(labels);
        if (!bound) { bound = true; send("streamlit:setFrameHeight", { height: 52 }); }
      });
      send("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
