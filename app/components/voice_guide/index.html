<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* dhoa-tokens:start (generated by tools/sync_component_tokens.py; do not edit) */
      :root {
        --page-background: #0f1419;
        --card-background: #182029;
        --raised-background: #212b36;
        --text-primary: #f2f5f8;
        --text-muted: #a3b0bd;
        --border: #2f3b48;
        --border-strong: #7a8a9b;
        --selected: #0072b2;
        --focus: #ffffff;
        --priority-high: #d55e00;
        --priority-medium: #f0e442;
        --priority-low: #009e73;
        --priority-unclassified: #9aa7b4;
        --accent-text: #56b4e9;
      }
      /* dhoa-tokens:end */
      html, body { margin: 0; background: transparent; color: var(--text-primary); font: 15px/1.6 "Noto Sans Bengali", "Nirmala UI", system-ui, sans-serif; }
      button {
        width: 100%; min-height: 44px; padding: 8px 16px; cursor: pointer;
        color: var(--text-primary); background: var(--raised-background); border: 1px solid var(--border-strong);
        border-radius: 10px; font: 600 15px/1.6 "Noto Sans Bengali", "Nirmala UI", system-ui, sans-serif;
      }
      button:hover { background: var(--card-background); border-color: var(--accent-text); }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      p { margin: 0; padding: 8px 2px; color: var(--text-muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <button id="go" type="button" aria-pressed="false" hidden></button>
    <p id="msg" role="status"></p>
    <script>
      // Read-aloud with the browser's own voice (used only when no pre-rendered AI voice file exists).
      // One-way Streamlit component: it never sends a value back, so it cannot cause a rerun.
      const button = document.getElementById("go");
      const msg = document.getElementById("msg");
      const synth = window.speechSynthesis;
      let args = {};
      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
      }
      function fit() {
        const h = Math.max(button.hidden ? 0 : 52, msg.textContent ? msg.offsetHeight + 4 : 0, 44);
        send("streamlit:setFrameHeight", { height: Math.ceil(h) });
      }
      function pickVoice() {
        const prefix = String(args.lang || "en").slice(0, 2).toLowerCase();
        const voices = synth && synth.getVoices ? synth.getVoices() : [];
        return voices.find((v) => String(v.lang).toLowerCase().indexOf(prefix) === 0) || null;
      }
      function stop() {
        if (synth) synth.cancel();
        button.textContent = args.read || "";
        button.setAttribute("aria-pressed", "false");
      }
      function setup() {
        if (!args.text) return;
        const voice = (synth && typeof SpeechSynthesisUtterance !== "undefined") ? pickVoice() : null;
        if (!voice) {
          button.hidden = true;
          msg.textContent = args.none || "";
          fit();
          return;
        }
        msg.textContent = "";
        button.hidden = false;
        button.textContent = args.read || "";
        button.onclick = () => {
          if (synth.speaking) { stop(); return; }
          const u = new SpeechSynthesisUtterance(args.text);
          u.lang = args.lang; u.voice = voice; u.rate = 0.95;
          u.onend = stop; u.onerror = stop;
          synth.speak(u);
          button.textContent = args.stop || "";
          button.setAttribute("aria-pressed", "true");
        };
        fit();
      }
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        args = event.data.args || {};
        document.documentElement.lang = String(args.lang || "bn").slice(0, 2);
        setup();
        if (synth) synth.onvoiceschanged = setup;  // voices load late in many browsers
        setTimeout(setup, 500);
      });
      window.addEventListener("pagehide", () => { if (synth) synth.cancel(); });
      send("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
