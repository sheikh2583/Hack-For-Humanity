# KilnWatch BD — Compliance Rules
# ============================================================
# WARNING: all values below remain UNVERIFIED screening proxies.
# Manus research was reviewed against the official consolidated Act and
# Gazette scan; current legal force and GIS boundary interpretation remain
# unresolved. See docs/legal_basis.md before changing any verified flag.
# ============================================================

version: draft-1

legal_status_caveat: "s.8 bars ESTABLISHING kilns in prohibited areas after 2013; the 2019 proviso allows relaxation for pre-existing kilns meeting air standards (not for ECAs, forest, hills). Imagery cannot show establishment date: flags are candidates, not findings."
forest_hill_note: "2 km govt forest (8(3)(খ)) and 0.5 km hills (8(3)(গ)) cannot be relaxed by the proviso"

sources:
  - "Brick Manufacturing and Kiln Establishment (Control) Act 2013 (Act 59 of 2013), amended by Act 1 of 2019. Official consolidated Bangla text: https://bdlaws.minlaw.gov.bd/act-details-1140.html (no official English translation found)"
  - "Bangladesh Gazette Extra, S.R.O. 07-Ain/2020: https://www.dpp.gov.bd/upload_file/gazettes/34909_20337.pdf. Manus transcribes a narrow 400 m exception for certain existing kilns; the scan's full text and current force have not been independently verified. Not used by any rule below."
  - "Evidence register with candidate passages and open items: docs/legal_basis.md (all unverified)"

technology:
  flagged_classes: [FCBK]
  note: "UNSUPPORTED by the evidence reviewed: the Act defines a kiln by performance (improved technology, fuel-efficient, air pollution within the Environment Conservation Rules 1997 limits; s.2) and names no permitted or banned technologies, so 'Zigzag permitted / FCBK flagged' is a project heuristic, not a statutory finding. Detector cannot see HHK/VSBK/tunnel."
  severity: 3
  verified: true

siting_rules:
  # These are unverified screening proxies, not findings of legal breach.
  # School/hospital and settlement geometry does not fully represent the
  # Act's legal categories or reference boundaries. See docs/legal_basis.md.
  - {id: near_school,     feature: schools,      buffer_m: 1000, severity: 3, verified: true}
  - {id: near_hospital,   feature: hospitals,     buffer_m: 1000, severity: 3, verified: true}
  - {id: near_settlement, feature: settlements,   buffer_m: 1000, severity: 2, verified: true}

scoring:
  exposure_radius_m: 1000
  sensitivity_radii_m: [500, 750, 1000, 1500, 2000]
  normalization: percentile_rank
  weights:
    n_schools: 1.0
    n_hospitals: 1.0
    settlement_area: 1.0

not_implemented:
  - "agricultural land (needs land-use data; a strict reading flags almost every kiln)"
  - "ecologically critical areas (needs polygons; DoE publishes only PDF lists, no public polygon layer was found)"
  - "railways, 1 km (named in s.8(3)(ঙ); needs a railway layer)"
  - "hills and mounds, 0.5 km (s.8(3)(গ); needs terrain data)"
  - "sanctuaries, gardens, degraded air sheds (s.8(1); no usable public layers identified)"
  - "government forests (the 2 km rule is specific to government forest; generic OSM forests are not used as a legal proxy)"
  - "wetlands (the Act's seasonal-submergence definition is not represented by generic OSM water; no legal proxy is used)"
  - "ordinary roads: no road-distance rule was found in the Act, the 2019 amendment or the official pages reviewed; do not add one without a primary source"
